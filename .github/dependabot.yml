# Keep the SHA-pinned actions in .github/workflows/ current. Dependabot is
# GitHub-native: no third-party app and no PAT. This repository has no package
# manager and no application build, so `github-actions` is the only ecosystem
# with a manifest to read here.
#
# Merge lanes follow the standards dependabot-policy component: the
# `vendor-actions` group (non-major only) is the auto-merge lane armed by
# pr-automerge-dependabot.yml; every other PR is reviewed by hand. A dependency
# joins the first group that matches it, so majors fall through to the
# reviewed `github-actions` group.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # An explicit labels: list replaces (not adds to) Dependabot's automatic
    # labels. Only `dependencies` is listed: the ecosystem default
    # `github_actions` is not in this org's github-iac label roster, and
    # Dependabot fails the apply with "label could not be found".
    # https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file#labels
    labels:
      - dependencies
    # `ci-status` fails a pull request whose title is not Conventional Commits,
    # and Dependabot's default title carries no type, so the prefix is
    # required rather than cosmetic.
    commit-message:
      prefix: build
    # Let a brand-new release settle before proposing it (supply-chain caution);
    # security-advisory updates bypass cooldown and still surface immediately.
    cooldown:
      default-days: 3
    groups:
      vendor-actions:
        patterns:
          - actions/*
          - github/*
          - anthropics/*
        update-types: [minor, patch]
      github-actions:
        patterns:
          - '*'
    # Every melodic-software/ci-workflows ref (reusable workflows AND composite
    # actions) moves only through deliberate reviewed PRs per the standards
    # runner-policy selector-revision lockstep, so all of them are ignored here.
    ignore:
      - dependency-name: "melodic-software/ci-workflows/*"
