name: CI

# This repository has no build and no package manager. CI is therefore the
# lint/validate proxies documented in AGENTS.md, plus the sync-local regression
# suite, run on every push and pull request.
#
# Scope note: the repo-root config files synced from melodic-software/standards
# (.editorconfig, .gitattributes, _typos.toml, lychee.toml, .gitleaks.toml,
# .markdownlint-cli2.jsonc, .editorconfig-checker.json) are validated by their
# own tooling upstream and are deliberately not re-linted here.

on:
  push:
    branches: [main]
  pull_request:
    # `edited`, `labeled` and `unlabeled` can change the pr-title /
    # do-not-merge / issue-linkage answers without a new commit, so the required
    # check has to re-evaluate. Whether such an event is CONTRACT-ONLY (lanes
    # gated off, ci-status carrying the recorded `ci-lanes` verdict forward) is
    # decided by one predicate, repeated verbatim in `cancel-in-progress` and in
    # every job's `if:` except `ci-status`:
    #
    #   github.event.pull_request.head.repo.full_name == github.repository &&
    #   (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) ||
    #    (github.event.action == 'edited' && !github.event.changes.base))
    #
    # An `edited` event carrying `changes.base` is a BASE-BRANCH change: the
    # merge commit the lanes test changes with it, so that runs in full. A fork
    # pull request is never contract-only — its token is read-only on
    # `pull_request` whatever `permissions:` requests, so it cannot record lane
    # state — and runs the full workflow on every event exactly as before.
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# The existing key is kept: on a `pull_request` event `github.ref` is
# `refs/pull/<n>/merge`, so this is already one group per pull request. A
# contract-only event never cancels: it must queue behind an in-flight full run
# so the `ci-lanes` status it reads is already written. GitHub keeps one running
# and one pending run per group and the newest pending wins, so the
# carry-forward always executes after the full run it depends on. A
# `synchronize` still cancels everything on the old SHA.
#
# The predicate is NOT conjoined with `github.event_name == 'pull_request'`
# here. This key falls back to `github.ref`, so every push to `main` shares one
# group, and that group's burst collapse is ci-workflows#122's decision. On a
# `push`, `merge_group` or `workflow_dispatch` event the predicate is false
# (`github.event.pull_request` is null), so this stays `true` there and the
# existing push-side behaviour is preserved exactly.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}

jobs:
  shell:
    name: Shell (shellcheck + regression suite)
    # The contract-only predicate, verbatim (see the `on.pull_request` comment).
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v5.1.0 — pinned to a full-length commit SHA because this
      # org requires it; a tag or short SHA is rejected at "Set up job".
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: shellcheck (must be zero findings)
        run: shellcheck scripts/*.sh .cursor/install.sh

      - name: bash -n (syntax floor)
        run: for f in scripts/*.sh .cursor/install.sh; do bash -n "$f"; done

      # pwsh is preinstalled on ubuntu-latest, so the suite exercises BOTH twins
      # here and asserts their output is byte-identical.
      - name: sync-local regression suite
        run: bash scripts/test-sync-local.sh

  powershell:
    name: PowerShell (PSScriptAnalyzer)
    # The contract-only predicate, verbatim (see the `on.pull_request` comment).
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v5.1.0 — pinned to a full-length commit SHA because this
      # org requires it; a tag or short SHA is rejected at "Set up job".
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force

      # Suppressions in sync-local.ps1 are deliberate and each carries a written
      # Justification; -SuppressedOnly is printed so a reviewer can see what is
      # being suppressed rather than having it silently disappear.
      - name: PSScriptAnalyzer (must be zero unsuppressed findings)
        shell: pwsh
        run: |
          $suppressed = Invoke-ScriptAnalyzer -Path ./scripts/sync-local.ps1 -SuppressedOnly
          if ($suppressed) {
            Write-Host "Deliberately suppressed (each carries a Justification):"
            $suppressed | Format-Table RuleName, @{n='Count';e={1}} -AutoSize | Out-String | Write-Host
          }
          $findings = Invoke-ScriptAnalyzer -Path ./scripts/sync-local.ps1
          if ($findings) {
            $findings | Format-Table Severity, RuleName, Line, Message -AutoSize -Wrap | Out-String | Write-Host
            throw "PSScriptAnalyzer reported $($findings.Count) finding(s)."
          }
          Write-Host "PSScriptAnalyzer: 0 findings."

  manifests:
    name: Manifests (JSON + official Cursor schemas)
    # The contract-only predicate, verbatim (see the `on.pull_request` comment).
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v5.1.0 — pinned to a full-length commit SHA because this
      # org requires it; a tag or short SHA is rejected at "Set up job".
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: jq — manifests are well-formed JSON
        run: |
          jq empty .cursor-plugin/marketplace.json
          for f in plugins/*/.cursor-plugin/plugin.json; do jq empty "$f"; done

      - name: Skill frontmatter — each SKILL.md opens with a YAML block
        run: |
          status=0
          for f in plugins/*/skills/*/SKILL.md; do
            if [ "$(head -1 "$f")" != "---" ]; then
              echo "::error file=$f::SKILL.md must start with a --- YAML frontmatter block"
              status=1
            fi
          done
          exit $status

      # Validated against Cursor's PUBLISHED schemas, fetched at run time. These
      # are the authority: Cursor's prose reference and its schemas disagree in
      # both directions, so a prose-derived checklist would pass files the
      # schema rejects. A fetch failure fails the job rather than skipping the
      # check silently.
      - name: Validate manifests against the official schemas
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-fund --no-audit --silent ajv@8 ajv-formats
          base=https://raw.githubusercontent.com/cursor/plugins/main/schemas
          curl -fsS "$base/marketplace.schema.json" -o marketplace.schema.json
          curl -fsS "$base/plugin.schema.json" -o plugin.schema.json
          node scripts/validate-manifests.mjs
          # Official environment.json contract (draft 2019-09). Linked from
          # https://cursor.com/docs/cloud-agent/setup — same authority rule as
          # the plugin schemas: fetch live, fail closed if the fetch fails.
          curl -fsS https://cursor.com/schemas/environment.schema.json -o environment.schema.json
          node scripts/validate-environment.mjs

  links:
    name: Docs (internal link integrity)
    # The contract-only predicate, verbatim (see the `on.pull_request` comment).
    if: ${{ !(github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || (github.event.action == 'edited' && !github.event.changes.base))) }}
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v5.1.0 — pinned to a full-length commit SHA because this
      # org requires it; a tag or short SHA is rejected at "Set up job".
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      # Relative links only. External URLs are deliberately NOT checked here:
      # GitHub and cursor.directory return 403/429 to CI runners, which would
      # make this job fail for reasons that say nothing about the repository.
      #
      # Inline code spans are stripped BEFORE extracting links. Without that, a
      # regex inside backticks parses as link syntax and reports a false
      # positive: the plugin-name pattern `^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$`
      # looks exactly like ](...) to a naive matcher.
      - name: Every relative markdown link resolves on disk
        run: |
          status=0
          while IFS= read -r src; do
            dir=$(dirname "$src")
            while IFS= read -r link; do
              case "$link" in http*|mailto:*|'') continue ;; esac
              target=${link%%#*}
              [ -z "$target" ] && continue
              if [ ! -e "$dir/$target" ]; then
                echo "::error file=$src::broken relative link -> $link"
                status=1
              fi
            done < <(sed 's/`[^`]*`//g' "$src" |
                     grep -oE '\]\([^)#][^)]*\)' |
                     sed 's/^](//; s/)$//')
          done < <(git ls-files '*.md')
          exit $status

  # Single aggregate lane, in the codex-plugins shape: `ci-status` is one of the
  # four contexts the org ci-gate ruleset requires, so every lane above has to
  # reach the gate through this one job name.
  ci-status:
    needs: [shell, powershell, manifests, links]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # pr-contract upserts the advisory linkage comment and moves the linkage
      # label; ci-status records the `ci-lanes` commit status the carry-forward
      # branch reads back on the next contract-only event.
      pull-requests: write
      statuses: write
    steps:
      - name: Check the pull-request contract
        uses: melodic-software/ci-workflows/.github/actions/pr-contract@449157aaa8e30f7b1457305d8048ebe6168e174a # v0.20.0
        with:
          token: ${{ github.token }}
      - name: Aggregate lane results
        # `!cancelled()` so a failing pr-contract step does not skip the
        # aggregation: the job still fails on the contract step's exit code, and
        # the `ci-lanes` status is on the SHA for the next contract-only run.
        if: ${{ !cancelled() }}
        uses: melodic-software/ci-workflows/.github/actions/ci-status@449157aaa8e30f7b1457305d8048ebe6168e174a # v0.20.0
        with:
          results: ${{ join(needs.*.result, ' ') }}
          # The replaced inline aggregator passed only `success`, so a `skipped`
          # lane was already red here.
          treat-skipped-as: fail
          token: ${{ github.token }}
